name: Create harmless bot PR

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Create PR through the workflow token
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const base = 'main';
            const branch = `bot-auth-test-${context.runId}`;
            const baseRef = await github.rest.git.getRef({ owner, repo, ref: `heads/${base}` });
            const baseSha = baseRef.data.object.sha;
            const baseCommit = await github.rest.git.getCommit({ owner, repo, commit_sha: baseSha });
            const blob = await github.rest.git.createBlob({
              owner, repo,
              content: `Harmless bot-auth test generated at run ${context.runId}.\n`,
              encoding: 'utf-8'
            });
            const tree = await github.rest.git.createTree({
              owner, repo,
              base_tree: baseCommit.data.tree.sha,
              tree: [{ path: 'bot-auth-test.txt', mode: '100644', type: 'blob', sha: blob.data.sha }]
            });
            const commit = await github.rest.git.createCommit({
              owner, repo,
              message: 'Create harmless bot-auth test PR',
              tree: tree.data.sha,
              parents: [baseSha]
            });
            await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${branch}`, sha: commit.data.sha });
            const pr = await github.rest.pulls.create({
              owner, repo, title: 'Harmless bot-auth test PR', head: branch, base,
              body: 'Disposable PR created by github-actions[bot] for the workflow_run authorization lab.'
            });
            core.info(`BOT_PR_URL=${pr.data.html_url}`);
            core.info(`BOT_PR_NUMBER=${pr.data.number}`);
            core.info(`BOT_PR_USER=${pr.data.user.login}`);
