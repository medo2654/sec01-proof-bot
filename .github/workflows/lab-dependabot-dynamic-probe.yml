name: Lab Dependabot dynamic workflow actor probe

on:
  workflow_run:
    workflows:
      - "npm_and_yarn in /. for minimist - Update #1529646081"
      - "npm_and_yarn in / for lodash - Update #1529638241"
    types: [requested, in_progress, completed]

permissions:
  contents: read
  pull-requests: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Capture Dependabot workflow_run actor fields
        shell: bash
        run: |
          set -euo pipefail
          echo "GITHUB_ACTOR=$GITHUB_ACTOR"
          echo "GITHUB_EVENT_NAME=$GITHUB_EVENT_NAME"
          jq '{action, workflow_run: {id: .workflow_run.id, name: .workflow_run.name, event: .workflow_run.event, actor: .workflow_run.actor.login, triggering_actor: .workflow_run.triggering_actor.login, head_sha: .workflow_run.head_sha, status: .workflow_run.status, conclusion: .workflow_run.conclusion}}' "$GITHUB_EVENT_PATH"
      - name: Run authorization probe
        uses: anthropics/claude-code-action@main
        with:
          allowed_bots: github-actions[bot]
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Controlled Dependabot dynamic workflow probe. Do not execute commands, modify files, or access secrets. Answer exactly: DYNAMIC_PROBE_REACHED
          claude_args: '--max-turns 1 --allowedTools "Read"'
          show_full_output: 'false'
